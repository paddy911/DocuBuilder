name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read   # nötig für SignPath

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - name: Bauen
        run: python -m PyInstaller --onefile --windowed --name DocuBuilder --version-file version_info.txt docubuilder.py

      - name: Unsignierte Datei hochladen
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: dist/DocuBuilder.exe

      # Signieren nur, wenn SignPath eingerichtet ist (Repository-Variable SIGNPATH_ORGANIZATION_ID gesetzt)
      - name: Mit SignPath signieren
        id: sign
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Signierte Datei übernehmen und prüfen
        if: ${{ steps.sign.outcome == 'success' }}
        shell: pwsh
        run: |
          $zip = Get-ChildItem signed -Filter *.zip -ErrorAction SilentlyContinue
          if ($zip) { Expand-Archive $zip.FullName -DestinationPath signed -Force }
          Copy-Item signed\DocuBuilder.exe dist\DocuBuilder.exe -Force
          $sig = Get-AuthenticodeSignature dist\DocuBuilder.exe
          Write-Host "Signaturstatus: $($sig.Status)"
          if ($sig.Status -ne 'Valid') { throw "Signatur ungültig: $($sig.Status)" }

      - name: Prüfsumme erzeugen
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\DocuBuilder.exe -Algorithm SHA256).Hash.ToLower()
          "$h  DocuBuilder.exe" | Out-File -Encoding ascii dist\DocuBuilder.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/DocuBuilder.exe
            dist/DocuBuilder.exe.sha256

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install pyinstaller
      - name: Bauen
        run: python -m PyInstaller --onefile --windowed --name DocuBuilder docubuilder.py
      - name: Prüfsumme erzeugen
        run: cd dist && sha256sum DocuBuilder > DocuBuilder.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/DocuBuilder
            dist/DocuBuilder.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/windows/DocuBuilder.exe
            out/windows/DocuBuilder.exe.sha256
            out/linux/DocuBuilder
            out/linux/DocuBuilder.sha256
